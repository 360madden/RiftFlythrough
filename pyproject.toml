[project]
name = "rift-flythrough"
version = "1.1.0"
description = "Offline 3D flythrough viewer for the RIFT MMORPG game world"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.51.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[project.scripts]
rift-flythrough = "run:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "run.py",
    "flythrough.html",
    "js",
    "merged.obj",
    "zone_locations.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--tb=short"]

[tool.coverage.run]
source = ["merge_objs", "validate_obj"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 70
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "UP",  # pyupgrade
    "TRY", # tryceratops (exception handling)
    "C90", # mccabe (complexity)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "TRY300",  # return-in-try (valid for server-launch patterns)
    "TRY003",  # long-exception-message (existing style)
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
"dev.py" = ["N802"]  # HTTP handler override required by SimpleHTTPRequestHandler

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
