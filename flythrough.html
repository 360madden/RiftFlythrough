<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIFT World Flythrough</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: monospace; }
  canvas { display: block; }

  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.8); color: #fff; z-index: 10;
    cursor: pointer; user-select: none;
  }
  #overlay.hidden { display: none; }
  #overlay-inner { text-align: center; }
  #overlay h1 { font-size: 2em; margin-bottom: 0.3em; }
  #overlay p { color: #aaa; margin-bottom: 0.5em; }
  #overlay .key { display: inline-block; background: #333; padding: 2px 8px;
    border-radius: 4px; margin: 0 2px; font-weight: bold; color: #fff; }
  #overlay .click { margin-top: 1.5em; font-size: 1.2em; color: #4f4; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  #loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9); color: #fff; z-index: 20; font-size: 1.2em;
  }
  #loading.hidden { display: none; }

  #info {
    position: fixed; bottom: 12px; left: 12px; color: #0f0;
    font-size: 12px; z-index: 5; pointer-events: none;
    background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px;
  }
  #info span { color: #fff; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 20px; height: 20px; z-index: 6; pointer-events: none; opacity: 0;
  }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #0f0; }
  #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
  #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
  #crosshair.active { opacity: 0.5; }

  #minimap-container {
    position: fixed; top: 12px; right: 12px;
    width: 200px; height: 200px;
    border: 2px solid rgba(0,255,0,0.4); border-radius: 4px;
    overflow: hidden; z-index: 5;
    background: rgba(5,5,15,0.8);
  }
  #minimap-label {
    position: fixed; top: 8px; right: 16px;
    color: #0f0; font-size: 10px; z-index: 6;
    pointer-events: none; opacity: 0.7;
  }
  #legend {
    position: fixed; top: 220px; right: 12px;
    color: #888; font-size: 10px; z-index: 5; pointer-events: none;
    background: rgba(0,0,0,0.5); padding: 4px 6px;
    border-radius: 3px; max-height: 120px; overflow: hidden;
  }
</style>
</head>
<body>

<div id="loading">Loading world geometry... <span id="progress">0%</span></div>

<div id="overlay">
  <div id="overlay-inner">
    <h1>RIFT World Flythrough</h1>
    <p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> move &bull;
       <span class="key">Space</span> up &bull; <span class="key">Ctrl</span> down</p>
    <p><span class="key">Mouse</span> look &bull;
       <span class="key">Scroll</span> speed &bull;
       <span class="key">M</span> minimap toggle &bull;
       <span class="key">Click minimap</span> teleport &bull;
       <span class="key">Esc</span> release mouse</p>
    <p class="click">Click anywhere to fly</p>
  </div>
</div>

<div id="crosshair"></div>
<div id="info"></div>
<div id="minimap-container"><canvas id="minimap-canvas" width="200" height="200"></canvas></div>
<div id="minimap-label">MINIMAP</div>
<div id="legend"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

// ── State ──
const keys = {};
let mouseLocked = false;
let moveSpeed = 50;
let showMinimap = true;
let worldGroups = [];
let groupColors = [];
const miniSize = 200;

// ── Color palette (HSL golden-angle cycling) ──
const GOLDEN_ANGLE = 0.618033988749895;
function groupColor(index, total) {
  const hue = ((index * GOLDEN_ANGLE * 360) % 360) / 360;
  return new THREE.Color().setHSL(hue, 0.55, 0.55);
}

// ── Scene setup ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.Fog(0x0a0a14, 500, 4000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
camera.position.set(0, 100, 200);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ── Minimap canvas ──
const miniCanvas = document.getElementById('minimap-canvas');
const miniCtx = miniCanvas.getContext('2d');

// ── Lighting ──
scene.add(new THREE.AmbientLight(0x334466, 0.6));
const sun = new THREE.DirectionalLight(0xffffcc, 1.2);
sun.position.set(500, 800, 300);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 3000;
sun.shadow.camera.left = -1000; sun.shadow.camera.right = 1000;
sun.shadow.camera.top = 1000; sun.shadow.camera.bottom = -1000;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8899cc, 0x334422, 0.4));

// ── Grid ──
scene.add(new THREE.GridHelper(2000, 40, 0x333355, 0x222244));

// ── Axis indicator ──
const axisLen = 500;
function makeAxis(points, color) {
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({ color })
  );
}
scene.add(makeAxis([new THREE.Vector3(0,0,0), new THREE.Vector3(axisLen,0,0)], 0xff3333));
scene.add(makeAxis([new THREE.Vector3(0,0,0), new THREE.Vector3(0,axisLen,0)], 0x33ff33));
scene.add(makeAxis([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,axisLen)], 0x3333ff));

// ── DOM refs ──
const loadingEl = document.getElementById('loading');
const progressEl = document.getElementById('progress');
const overlayEl = document.getElementById('overlay');
const crosshairEl = document.getElementById('crosshair');
const infoEl = document.getElementById('info');
const legendEl = document.getElementById('legend');
const miniContainer = document.getElementById('minimap-container');
const miniLabel = document.getElementById('minimap-label');

let worldBounds = { minX: 0, maxX: 1, minZ: 0, maxZ: 1 };

// ── Load OBJ ──
const loader = new OBJLoader();
loader.load(
  'merged.obj',
  (obj) => {
    const box = new THREE.Box3().setFromObject(obj);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    // Store world bounds for minimap
    worldBounds = {
      minX: box.min.x, maxX: box.max.x,
      minZ: box.min.z, maxZ: box.max.z,
    };
    obj.position.sub(center);
    worldBounds.minX -= center.x; worldBounds.maxX -= center.x;
    worldBounds.minZ -= center.z; worldBounds.maxZ -= center.z;

    // Color-code each group
    const children = obj.children.filter(c => c.isGroup);
    groupColors = children.map((_, i) => groupColor(i, children.length));

    let groupCounter = 0;
    const groupIndexMap = new Map();
    obj.traverse((child) => {
      if (child.isGroup && child.name && child.name.startsWith('o ')) {
        groupIndexMap.set(child, groupCounter++);
      }
    });
    obj.traverse((child) => {
      // Find parent group index for coloring
      let groupIdx = 0;
      let p = child.parent;
      while (p && p !== obj) {
        if (groupIndexMap.has(p)) {
          groupIdx = groupIndexMap.get(p);
          break;
        }
        p = p.parent;
      }
      const color = groupColors[groupIdx] || new THREE.Color(0x889999);

      if (child.isMesh) {
        child.material = new THREE.MeshPhongMaterial({
          color, specular: 0x111111, shininess: 10,
          flatShading: false, side: THREE.DoubleSide,
        });
        child.castShadow = true;
        child.receiveShadow = true;
      } else if (child.isPoints) {
        // Point clouds from p directives get brighter, more opaque dots
        child.material = new THREE.PointsMaterial({
          color,
          size: 1.5,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.8,
        });
      }
    });

        // Ground plane at world bottom (created after OBJ loads so we know the bounds)
    let groundPlane = null;

    scene.add(obj);
    worldGroups = children;

    // Create ground plane at world min Y
    const groundY = box.min.y - center.y;
    const groundGeo = new THREE.PlaneGeometry(size.x * 1.1, size.z * 1.1);
    const groundMat = new THREE.MeshBasicMaterial({
      color: 0x1a1a2e,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.3,
    });
    groundPlane = new THREE.Mesh(groundGeo, groundMat);
    groundPlane.rotation.x = -Math.PI / 2;
    groundPlane.position.set(0, groundY, 0);
    groundPlane.receiveShadow = true;
    scene.add(groundPlane);
    loadingEl.classList.add('hidden');

    // Legend
    const ptonlyCount = children.filter(g => g.name && g.name.startsWith('ptonly_')).length;
    const facedCount = children.length - ptonlyCount;
    const topGroups = children.filter(g => g.name && !g.name.startsWith('ptonly_')).slice(0, 12).map((g, i) => {
      const c = groupColors[i];
      return '<span style="color:#' + c.getHexString() + '">&#9632;</span> ' + (g.name||'?').slice(0,30);
    });
    legendEl.innerHTML = topGroups.join('<br>') +
      (facedCount > 12 ? '<br>... +' + (facedCount-12) + ' more faced' : '') +
      (ptonlyCount > 0 ? '<br><span style=\"color:#aac\">. ' + ptonlyCount + ' point clouds</span>' : '');

    infoEl.innerHTML =
      'Groups: <span>' + children.length + '</span> | ' +
      'World: <span>' + size.x.toFixed(0) + ' x ' + size.z.toFixed(0) + '</span> | ' +
      'Speed: <span id="speedval">50</span>';

    console.log('Loaded:', { groups: children.length, bounds: worldBounds });
    camera.position.set(0, maxDim * 0.3, maxDim * 0.6);
    camera.lookAt(0, 0, 0);
  },
  (xhr) => {
    if (xhr.total > 0) progressEl.textContent = Math.round(xhr.loaded/xhr.total*100) + '%';
  },
  (err) => {
    loadingEl.innerHTML = '<span style="color:#f44">Error: ' + (err.message||err) + '</span>';
    console.error('Load error:', err);
  }
);

// ── Controls ──
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const direction = new THREE.Vector3();
const right = new THREE.Vector3();

let mouseDX = 0, mouseDY = 0;
document.addEventListener('mousemove', (e) => {
  if (!mouseLocked) return;
  mouseDX += e.movementX;
  mouseDY += e.movementY;
});

document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyM') {
    showMinimap = !showMinimap;
    miniContainer.style.display = showMinimap ? '' : 'none';
    miniLabel.style.display = showMinimap ? '' : 'none';
  }
});
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

overlayEl.addEventListener('click', () => renderer.domElement.requestPointerLock());

document.addEventListener('pointerlockchange', () => {
  mouseLocked = document.pointerLockElement === renderer.domElement;
  if (mouseLocked) {
    overlayEl.classList.add('hidden');
    crosshairEl.classList.add('active');
    mouseDX = 0; mouseDY = 0;
  } else {
    overlayEl.classList.remove('hidden');
    crosshairEl.classList.remove('active');
  }
});

document.addEventListener('wheel', (e) => {
  moveSpeed = Math.max(5, Math.min(500, moveSpeed + e.deltaY * -0.1));
  const sv = document.getElementById('speedval');
  if (sv) sv.textContent = Math.round(moveSpeed);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Minimap draw ──
function drawMinimap() {
  const w = miniSize, h = miniSize;
  miniCtx.fillStyle = 'rgba(5,5,15,0.9)';
  miniCtx.fillRect(0, 0, w, h);

  const { minX, maxX, minZ, maxZ } = worldBounds;
  const padX = (maxX - minX) * 0.05;
  const padZ = (maxZ - minZ) * 0.05;
  const mapMinX = minX - padX, mapMaxX = maxX + padX;
  const mapMinZ = minZ - padZ, mapMaxZ = maxZ + padZ;
  const scaleX = w / (mapMaxX - mapMinX);
  const scaleZ = h / (mapMaxZ - mapMinZ);

  function toScreen(wx, wz) {
    return [
      (wx - mapMinX) * scaleX,
      h - (wz - mapMinZ) * scaleZ,
    ];
  }

  // World bounds outline
  miniCtx.strokeStyle = 'rgba(0,255,0,0.3)';
  miniCtx.lineWidth = 1;
  const [bx, bz] = toScreen(minX, minZ);
  const [bx2, bz2] = toScreen(maxX, maxZ);
  miniCtx.strokeRect(bx, bz2, bx2 - bx, bz - bz2);

  // Distance ticks and labels every 500 units
  miniCtx.fillStyle = 'rgba(0,255,0,0.4)';
  miniCtx.font = '9px monospace';
  miniCtx.textAlign = 'center';
  for (let tick = Math.ceil(mapMinX / 500) * 500; tick <= mapMaxX; tick += 500) {
    const [tx] = toScreen(tick, mapMinZ);
    if (tx > 4 && tx < w - 4) {
      miniCtx.fillRect(tx - 0.5, h - 8, 1, 6);
      if (tick % 1000 === 0) miniCtx.fillText(tick, tx, h - 2);
    }
  }
  miniCtx.textAlign = 'left';
  for (let tick = Math.ceil(mapMinZ / 500) * 500; tick <= mapMaxZ; tick += 500) {
    const [, ty] = toScreen(mapMinX, tick);
    if (ty > 8 && ty < h - 4) {
      miniCtx.fillRect(2, ty - 0.5, 6, 1);
      if (tick % 1000 === 0) miniCtx.fillText(tick, 10, ty + 3);
    }
  }

  // Compass directions
  miniCtx.font = 'bold 11px monospace';
  miniCtx.textAlign = 'center';
  miniCtx.fillStyle = '#0f0';
  const [cx, cz] = toScreen((mapMinX + mapMaxX) / 2, mapMinZ);
  miniCtx.fillText('N', cx, 14);
  miniCtx.fillText('S', cx, h - 14);
  miniCtx.textAlign = 'left';
  const [, cy2] = toScreen(mapMinX, (mapMinZ + mapMaxZ) / 2);
  miniCtx.fillText('W', 4, cy2 + 4);
  miniCtx.textAlign = 'right';
  miniCtx.fillText('E', w - 4, cy2 + 4);

  // Group centroid dots
  const seenDirs = new Set();
  for (let i = 0; i < worldGroups.length; i++) {
    const bbox = new THREE.Box3().setFromObject(worldGroups[i]);
    const c = bbox.getCenter(new THREE.Vector3());
    const [sx, sy] = toScreen(c.x, c.z);
    const key = Math.round(sx/3) + ',' + Math.round(sy/3);
    if (seenDirs.has(key)) continue;
    seenDirs.add(key);

    const color = groupColors[i] || new THREE.Color(0x889999);
    miniCtx.fillStyle = '#' + color.getHexString();
    const dotSize = Math.max(1.5, 4 - (i / worldGroups.length) * 3);
    miniCtx.fillRect(sx - dotSize/2, sy - dotSize/2, dotSize, dotSize);
  }

  // Player position
  const [px, py] = toScreen(camera.position.x, camera.position.z);
  miniCtx.fillStyle = '#0f0';
  miniCtx.beginPath();
  miniCtx.arc(px, py, 4, 0, Math.PI * 2);
  miniCtx.fill();
  miniCtx.strokeStyle = '#fff';
  miniCtx.lineWidth = 1;
  miniCtx.stroke();

  // Direction indicator
  const dx = -Math.sin(euler.y);
  const dz = -Math.cos(euler.y);
  miniCtx.strokeStyle = '#0f0';
  miniCtx.lineWidth = 1.5;
  miniCtx.beginPath();
  miniCtx.moveTo(px, py);
  miniCtx.lineTo(px + dx * 12, py + dz * 12);
  miniCtx.stroke();
}

// ── Minimap click-to-teleport ──
miniCanvas.addEventListener('click', (e) => {
  if (!worldGroups.length) return;  // guard: OBJ not loaded yet
  const rect = miniCanvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  const { minX, maxX, minZ, maxZ } = worldBounds;
  const padX = (maxX - minX) * 0.05;
  const padZ = (maxZ - minZ) * 0.05;
  const mapMinX = minX - padX, mapMaxX = maxX + padX;
  const mapMinZ = minZ - padZ, mapMaxZ = maxZ + padZ;

  // Reverse transform from screen to world
  const wx = mapMinX + (cx / miniSize) * (mapMaxX - mapMinX);
  const wz = mapMinZ + ((miniSize - cy) / miniSize) * (mapMaxZ - mapMinZ);

  // Teleport camera (keep current height)
  camera.position.x = wx;
  camera.position.z = wz;
  // camera.position.y is preserved
});

// ── Game loop ──
const clock = new THREE.Clock();
let miniFrameCounter = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if (mouseLocked) {
    const sensitivity = 0.002;
    euler.setFromQuaternion(camera.quaternion);
    euler.y -= mouseDX * sensitivity;
    euler.x -= mouseDY * sensitivity;
    euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
    camera.quaternion.setFromEuler(euler);
    mouseDX = 0; mouseDY = 0;

    const speed = moveSpeed * (keys['ShiftLeft'] || keys['ShiftRight'] ? 3 : 1);
    camera.getWorldDirection(direction);
    right.crossVectors(camera.up, direction).normalize();

    if (keys['KeyW']) camera.position.addScaledVector(direction, speed * dt);
    if (keys['KeyS']) camera.position.addScaledVector(direction, -speed * dt);
    if (keys['KeyA']) camera.position.addScaledVector(right, speed * dt);
    if (keys['KeyD']) camera.position.addScaledVector(right, -speed * dt);
    if (keys['Space']) camera.position.y += speed * dt;
    if (keys['ControlLeft'] || keys['ControlRight']) camera.position.y -= speed * dt;

    const pos = camera.position;
    infoEl.innerHTML =
      'Pos: <span>' + pos.x.toFixed(0) + ', ' + pos.y.toFixed(0) + ', ' + pos.z.toFixed(0) + '</span> | ' +
      'Speed: <span id="speedval">' + Math.round(moveSpeed) + '</span> | ' +
      '<span style="color:#888">M=toggle minimap</span>';
  }

  miniFrameCounter++;
  if (showMinimap && miniFrameCounter % 5 === 0) {
    drawMinimap();
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
