name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Pytest with coverage
        run: python -m pytest tests/ -q --cov=merge_objs --cov=validate_obj --cov-report=term --cov-fail-under=70

      - name: Validate OBJ
        run: python validate_obj.py --obj merged.obj

      - name: Visual asset audit
        run: >
          python audit_visual_assets.py --obj merged.obj
          --texture-map js/texture_map.js
          --output-dir artifacts/visual-audit
          --top 25

      - name: Upload visual asset audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-asset-audit-artifacts
          path: artifacts/visual-audit
          retention-days: 7
          if-no-files-found: ignore

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: JS syntax/import/regression check
        run: python check_js.py

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: HTML structure check
        run: python check_html.py

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install chromium

      - name: Browser smoke test
        run: >
          python check_browser_smoke.py --timeout 60
          --strict-textures
          --texture-fixture
          --exercise-texture-quality-live
          --save-artifacts
          --artifacts-dir artifacts/browser-smoke/default

      - name: Browser smoke test (texture quality off startup)
        run: >
          python check_browser_smoke.py --timeout 60
          --settings-json '{"textureQuality":"off"}'
          --expect-texture-status off
          --forbid-generated-texture-requests
          --skip-sidebar-smoke
          --save-artifacts
          --artifacts-dir artifacts/browser-smoke/texture-off

      - name: Browser smoke test (beauty visual profile)
        run: >
          python check_browser_smoke.py --timeout 60
          --settings-json '{"visualProfile":"beauty","gridVisible":false,"groundVisible":false,"waterVisible":false,"wireframeMode":false,"showLegend":false,"showZoneLabels":false,"pointCloudsVisible":false,"hideDegenerateGroups":true,"hideUnlinkedGroups":true,"hidePlaceholderTextureGroups":true,"hideLowConfidenceGroups":true,"lodEnabled":false}'
          --expect-startup-settings
          --skip-sidebar-smoke
          --hide-start-overlay
          --save-artifacts
          --artifacts-dir artifacts/browser-smoke/beauty-profile

      - name: Capture Beauty visual baselines
        run: >
          python capture_visual_baselines.py --timeout 60
          --texture-fixture
          --strict-textures
          --output-dir artifacts/browser-smoke/visual-baselines

      - name: Browser smoke test (persisted startup settings)
        run: >
          python check_browser_smoke.py --timeout 60
          --settings-json '{"textureQuality":"off","gridVisible":false,"groundVisible":false,"waterVisible":false,"wireframeMode":true,"minimapVisible":false,"fpsVisible":true}'
          --expect-texture-status off
          --expect-startup-settings
          --forbid-generated-texture-requests
          --skip-sidebar-smoke
          --save-artifacts
          --artifacts-dir artifacts/browser-smoke/startup-settings

      - name: Summarize browser smoke timings
        if: ${{ always() }}
        run: >
          python summarize_timings.py --artifacts-dir artifacts/browser-smoke
          --output artifacts/browser-smoke/timing-baseline.md
          --allow-empty

      - name: Upload browser smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-artifacts
          path: artifacts/browser-smoke
          retention-days: 7
          if-no-files-found: ignore
