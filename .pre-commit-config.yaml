repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: npx --yes @biomejs/biome check --fix
        language: system
        types_or: [javascript, html, css]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
