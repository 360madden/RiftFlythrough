repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-js
        name: JS syntax check
        entry: python check_js.py
        language: system
        types: [javascript]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: check-html
        name: HTML validation
        entry: python check_html.py
        language: system
        types: [html]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
